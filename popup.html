<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pengaturan Masa</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h2>⏳ Masa</h2>
      
      <!-- Toggle ON/OFF Switch -->
      <label class="switch" title="Nyalakan/Matikan Ekstensi">
        <input type="checkbox" id="master-toggle">
        <span class="slider round"></span>
      </label>
    </div>
    <p>Penjaga Fokus Anda</p>
  </div>
  
  <div class="stats-card">
    <div class="stats-label">Total Waktu Terbuang Hari Ini</div>
    <div id="time-display">0m 0s</div>
    
    <!-- Inline Reset UI untuk menghindari bug window.confirm -->
    <div id="reset-section">
      <button id="reset-btn">🔄 Reset Timer</button>
      <div id="reset-confirm" class="hidden">
        <span class="confirm-text">Yakin?</span>
        <button id="reset-yes">Ya</button>
        <button id="reset-no">Batal</button>
      </div>
    </div>
  </div>
  
  <div class="settings">
    <h3>Daftar Putih (Produkif)</h3>
    <p class="desc">Domain di bawah ini tidak akan memicu stopwatch.</p>
    
    <div class="add-domain-wrapper">
      <input type="text" id="new-domain" placeholder="Cth: wikipedia.org">
      <button id="add-btn">Tambah</button>
    </div>
    
    <ul id="allowlist-ul">
      <!-- Diisi oleh Javascript -->
    </ul>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
